# =====================================================================
# Spring Realm Check
# ---------------------------------------------------------------------
# A single gated pipeline for the eshop Spring Boot application.
#
# The realm is only opened once the build proves itself, in order:
#
#   Forge      -> compile, run the JUnit suite, package the JAR
#   Gate       -> enforce the JaCoCo coverage threshold
#   Watchtower -> SAST via GitHub CodeQL
#   Warden     -> SCA via Trivy (Aqua Security)
#   Siege      -> DAST via OWASP ZAP against the live API
#   Verdict    -> single aggregated status for branch protection
#
# The three security scans run in parallel with each other, but all of
# them wait on the coverage gate - no scan burns runner minutes on a
# build that could not meet its test bar.
# =====================================================================
name: Spring Realm Check

# Triggers: every push on any branch, every pull request, plus a nightly
# sweep. '**' covers branches containing slashes such as feature/add-cart;
# a plain '*' would miss those.
# Note: scheduled runs only ever fire on the repository's default branch.
on:
  push:
    branches:
      - '**'
  pull_request:
  schedule:
    # Nightly at 02:00 UTC - catches newly disclosed CVEs in dependencies
    # that were clean at the time of the last commit.
    - cron: '0 2 * * *'

# Restrict the GITHUB_TOKEN to the minimum this workflow needs.
# security-events: write is required to publish CodeQL and Trivy findings
# to the repository's Code Scanning tab.
permissions:
  contents: read
  security-events: write

# If a newer commit is pushed to the same branch, cancel the older run
# instead of letting both finish. Saves runner minutes.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# Single place to change the coverage rule.
env:
  # Minimum acceptable coverage percentage.
  COVERAGE_THRESHOLD: '60'
  # Which JaCoCo counter to measure: INSTRUCTION or LINE.
  COVERAGE_COUNTER: 'INSTRUCTION'
  # Must match <outputDirectory> of the jacoco report execution in pom.xml.
  REPORT_DIR: 'target/jacoco-reports'

jobs:

  # ===================================================================
  # STAGE 1 - FORGE
  # Compile the application, run the tests, and hand the generated
  # JaCoCo output and packaged JAR to the jobs downstream.
  # ===================================================================
  build:
    name: Forge - Build and Test
    runs-on: ubuntu-latest
    timeout-minutes: 20   # Prevents a hung build from consuming minutes
    steps:

      # Fetches the repository into the runner workspace.
      - name: Checkout repository
        uses: actions/checkout@v4

      # Installs JDK 17 (required by the project) and enables dependency
      # caching so that Maven does not re-download the world on every run.
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven

      # "verify" runs the full lifecycle: compile, test, JaCoCo report, package.
      #   -B   batch mode, no interactive prompts
      #   -ntp hides the download progress noise from the logs
      - name: Build and run tests
        run: mvn -B -ntp clean verify

      # if:always() means this runs even when the build fails, so that a
      # coverage failure can still be investigated. Short retention because
      # this is an intermediate hand-off, not the deliverable.
      - name: Upload raw JaCoCo output
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: jacoco-raw
          path: ${{ env.REPORT_DIR }}/
          retention-days: 1
          if-no-files-found: error

      # Surefire XML makes a failing test much easier to diagnose than logs.
      - name: Upload Surefire test reports
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: surefire-reports
          path: target/surefire-reports/
          retention-days: 7
          if-no-files-found: ignore

      # The packaged application. Reused by the DAST job so that ZAP attacks
      # the exact artifact this run produced.
      # The filename comes from <finalName> in pom.xml.
      - name: Upload application JAR
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: eshop-manager-jar
          path: target/eshop-manager.jar
          retention-days: 7
          if-no-files-found: error

  # ===================================================================
  # STAGE 2 - GATE
  # Calculate the coverage percentage, enforce the threshold, and
  # publish the report only if the threshold is met. Everything that
  # follows is blocked until this passes.
  # ===================================================================
  coverage:
    name: Gate - Coverage Threshold
    runs-on: ubuntu-latest
    needs: build          # Runs only after the build job succeeds
    timeout-minutes: 10
    steps:

      # This job has no checkout and no JDK - it only parses files, so it
      # does not need them.
      - name: Download raw JaCoCo output
        uses: actions/download-artifact@v4
        with:
          name: jacoco-raw
          path: jacoco-reports

      # JaCoCo writes CSV and XML alongside the HTML report, so the number can
      # be read from a stable column format rather than scraped from HTML.
      #
      # JaCoCo CSV columns (1-indexed):
      #   1 GROUP              2 PACKAGE             3 CLASS
      #   4 INSTRUCTION_MISSED 5 INSTRUCTION_COVERED
      #   6 BRANCH_MISSED      7 BRANCH_COVERED
      #   8 LINE_MISSED        9 LINE_COVERED
      #  10 COMPLEXITY_MISSED 11 COMPLEXITY_COVERED
      #  12 METHOD_MISSED     13 METHOD_COVERED
      - name: Calculate coverage
        id: cov
        run: |
          set -euo pipefail   # Fail on error, unset variable, or broken pipe

          CSV="jacoco-reports/jacoco.csv"
          if [ ! -f "$CSV" ]; then
            echo "::error::jacoco.csv not found at $CSV."
            echo "Check REPORT_DIR against <outputDirectory> in pom.xml."
            exit 1
          fi

          # Pick the column pair for the configured counter.
          case "$COVERAGE_COUNTER" in
            INSTRUCTION) MISS_COL=4; COV_COL=5 ;;
            LINE)        MISS_COL=8; COV_COL=9 ;;
            *) echo "::error::COVERAGE_COUNTER must be INSTRUCTION or LINE"; exit 1 ;;
          esac

          # Sum missed and covered across all rows, skipping the header.
          PERCENT=$(awk -F',' -v m="$MISS_COL" -v c="$COV_COL" '
            NR > 1 { miss += $m; cov += $c }
            END {
              total = miss + cov
              if (total == 0) { exit 1 }
              printf "%.2f", (cov / total) * 100
            }' "$CSV")

          [ -n "$PERCENT" ] || { echo "::error::No coverage value derived."; exit 1; }

          echo "percent=$PERCENT" >> "$GITHUB_OUTPUT"
          echo "Coverage ($COVERAGE_COUNTER): $PERCENT%"

          # Surface the number in the run summary so nobody has to open logs.
          {
            echo "## Test Coverage"
            echo ""
            echo "| Counter | Coverage | Threshold |"
            echo "|---------|----------|-----------|"
            echo "| $COVERAGE_COUNTER | ${PERCENT}% | ${COVERAGE_THRESHOLD}% |"
          } >> "$GITHUB_STEP_SUMMARY"

      # The percentage is a decimal, so bash [ -lt ] cannot be used - it is
      # integer-only and will throw a syntax error on a value like 61.50.
      # awk handles the comparison instead.
      #
      # The step output is passed through env rather than being interpolated
      # directly into the script body, which is the safer pattern.
      - name: Enforce minimum coverage
        env:
          PERCENT: ${{ steps.cov.outputs.percent }}
        run: |
          set -euo pipefail

          if awk -v p="$PERCENT" -v t="$COVERAGE_THRESHOLD" \
                 'BEGIN { exit !(p + 0 < t + 0) }'; then
            echo "::error::Coverage ${PERCENT}% is below the required ${COVERAGE_THRESHOLD}%."
            {
              echo ""
              echo "**Result: FAILED** - below threshold. Security scans skipped."
              echo "Download the \`jacoco-raw\` artifact to see uncovered classes."
            } >> "$GITHUB_STEP_SUMMARY"
            exit 1
          fi

          echo "Coverage requirement satisfied: ${PERCENT}% >= ${COVERAGE_THRESHOLD}%"
          printf '\n**Result: PASSED** - opening the realm to security scans.\n' \
            >> "$GITHUB_STEP_SUMMARY"

      # A failed step aborts the remaining steps in the job, so this is
      # reached only when the gate above passes. The published report
      # therefore always represents a build that met the requirement.
      - name: Publish coverage report
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report-${{ github.run_number }}
          path: jacoco-reports/
          retention-days: 30
          if-no-files-found: error

  # ===================================================================
  # STAGE 3a - WATCHTOWER (SAST)
  # GitHub CodeQL: semantic analysis of the application's own source.
  # Findings land in the Security -> Code scanning tab.
  # ===================================================================
  codeql:
    name: Watchtower - SAST (CodeQL)
    runs-on: ubuntu-latest
    needs: coverage       # Gated on the coverage threshold
    timeout-minutes: 20
    permissions:
      contents: read
      security-events: write
      actions: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven

      # build-mode: manual means CodeQL observes the compiler as our own
      # Maven command runs, rather than guessing how to build the project.
      # security-extended widens the default query pack for deeper coverage.
      - name: Initialize CodeQL
        uses: github/codeql-action/init@v3
        with:
          languages: java-kotlin
          build-mode: manual
          queries: security-extended

      # Tests already ran in the Forge stage - compiling is enough here, and
      # -DskipTests keeps this job fast.
      - name: Compile for CodeQL
        run: mvn -B -ntp clean compile -DskipTests

      - name: Perform CodeQL analysis
        uses: github/codeql-action/analyze@v3
        with:
          category: '/language:java-kotlin'

  # ===================================================================
  # STAGE 3b - WARDEN (SCA)
  # Trivy (Aqua Security): scans declared dependencies in pom.xml for
  # known CVEs, and the repository for leaked secrets and IaC issues.
  # ===================================================================
  trivy:
    name: Warden - SCA (Trivy)
    runs-on: ubuntu-latest
    needs: coverage       # Gated on the coverage threshold
    timeout-minutes: 15
    permissions:
      contents: read
      security-events: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      # Human-readable output in the log, and the gate itself:
      # exit-code 1 fails the job on any fixable HIGH/CRITICAL finding.
      # --ignore-unfixed avoids failing on CVEs with no available patch.
      - name: Trivy scan (gate)
        uses: aquasecurity/trivy-action@0.24.0
        with:
          scan-type: fs
          scan-ref: .
          scanners: 'vuln,secret,misconfig'
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          format: table
          exit-code: '1'

      # Second pass purely to produce SARIF for the Code Scanning tab.
      # exit-code 0 because the gate above already decided pass/fail;
      # if:always() ensures findings are still published when it failed.
      - name: Trivy scan (SARIF report)
        if: always()
        uses: aquasecurity/trivy-action@0.24.0
        with:
          scan-type: fs
          scan-ref: .
          scanners: 'vuln,secret,misconfig'
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          format: sarif
          output: trivy-results.sarif
          exit-code: '0'

      - name: Upload Trivy SARIF
        if: always()
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: trivy-results.sarif
          category: trivy

  # ===================================================================
  # STAGE 3c - SIEGE (DAST)
  # OWASP ZAP: boots the JAR produced by the Forge stage and attacks the
  # live API through its OpenAPI document. The DEV profile is used because
  # it runs on in-memory H2 and needs no external database.
  # ===================================================================
  zap:
    name: Siege - DAST (OWASP ZAP)
    runs-on: ubuntu-latest
    needs: coverage       # Gated on the coverage threshold
    timeout-minutes: 25
    permissions:
      contents: read
    steps:
      # Needed for .zap/rules.tsv, which tunes which alerts are actionable.
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      # Reuse the exact artifact the Forge stage packaged rather than
      # rebuilding - what gets attacked is what was built.
      - name: Download application JAR
        uses: actions/download-artifact@v4
        with:
          name: eshop-manager-jar
          path: .

      # DEV overrides the datasource to in-memory H2. DB_PASSWORD is set to a
      # throwaway value only to satisfy the ${DB_PASSWORD} placeholder in the
      # shared datasource block of application.yml.
      - name: Start application (DEV profile)
        env:
          DB_PASSWORD: ci-not-used
        run: |
          set -euo pipefail
          nohup java -jar eshop-manager.jar \
            --spring.profiles.active=DEV > app.log 2>&1 &
          echo $! > app.pid

      - name: Wait for the API to come up
        run: |
          set -euo pipefail
          for i in $(seq 1 45); do
            if curl -sf http://localhost:8080/v3/api-docs > /dev/null; then
              echo "Application is up after ${i} attempt(s)."
              exit 0
            fi
            sleep 2
          done
          echo "::error::Application did not become ready in time."
          cat app.log
          exit 1

      # -I means do not fail the job on warning-level alerts. Rules promoted
      # to FAIL in .zap/rules.tsv still break the build.
      - name: Run ZAP API scan
        uses: zaproxy/action-api-scan@v0.7.0
        with:
          target: 'http://localhost:8080/v3/api-docs'
          format: openapi
          rules_file_name: '.zap/rules.tsv'
          cmd_options: '-I'
          allow_issue_writing: false

      - name: Stop application
        if: always()
        run: kill "$(cat app.pid)" 2>/dev/null || true

      # The app log explains a ZAP run that found nothing because the API
      # never actually started.
      - name: Upload application log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: dast-app-log
          path: app.log
          retention-days: 7
          if-no-files-found: ignore

  # ===================================================================
  # VERDICT
  # One aggregated status to use as the required check in branch
  # protection, instead of ticking five separate jobs.
  # ===================================================================
  verdict:
    name: Verdict - Realm Status
    runs-on: ubuntu-latest
    needs: [build, coverage, codeql, trivy, zap]
    if: always()          # Must run even when an upstream job failed
    timeout-minutes: 5
    steps:
      - name: Summarise and decide
        env:
          BUILD: ${{ needs.build.result }}
          COVERAGE: ${{ needs.coverage.result }}
          CODEQL: ${{ needs.codeql.result }}
          TRIVY: ${{ needs.trivy.result }}
          ZAP: ${{ needs.zap.result }}
        run: |
          set -euo pipefail

          {
            echo "## Spring Realm Check - Verdict"
            echo ""
            echo "| Stage | Job | Result |"
            echo "|-------|-----|--------|"
            echo "| Forge | Build and Test | $BUILD |"
            echo "| Gate | Coverage Threshold | $COVERAGE |"
            echo "| Watchtower | SAST (CodeQL) | $CODEQL |"
            echo "| Warden | SCA (Trivy) | $TRIVY |"
            echo "| Siege | DAST (OWASP ZAP) | $ZAP |"
          } >> "$GITHUB_STEP_SUMMARY"

          FAILED=""
          for stage in BUILD COVERAGE CODEQL TRIVY ZAP; do
            result="${!stage}"
            # 'skipped' is only reachable when an upstream job already failed,
            # so the failure is reported there rather than counted twice.
            if [ "$result" != "success" ] && [ "$result" != "skipped" ]; then
              FAILED="$FAILED $stage"
            fi
          done

          if [ -n "$FAILED" ]; then
            echo "::error::Realm check failed:${FAILED}"
            printf '\n**Realm status: BREACHED** -%s\n' "$FAILED" >> "$GITHUB_STEP_SUMMARY"
            exit 1
          fi

          echo "All stages passed."
          printf '\n**Realm status: SECURE**\n' >> "$GITHUB_STEP_SUMMARY"
