spring:
  application:
    name: eshop-manager

  profiles:
    active: DEV

  # Common settings for all environments
  datasource:
    driver-class-name: org.postgresql.Driver
    username: eshop_user
    password: ${DB_PASSWORD}

  liquibase:
    change-log: classpath:db/db.changelog-master.xml
    enabled: true

server:
  port: 8080

logging:
  level:
    root: INFO
    org.springframework: INFO

# Swagger Configuration
springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html

# DEV
---
spring:
  config:
    activate:
      on-profile: DEV

  datasource:
    url: jdbc:h2:mem:eshopdb;DB_CLOSE_DELAY=-1
    driver-class-name: org.h2.Driver
    username: sa
    password: dev@123

  jpa:
    hibernate:
      ddl-auto: none
    show-sql: true
    database-platform: org.hibernate.dialect.H2Dialect

  h2:
    console:
      enabled: true
      path: /h2-console
      settings:
        web-allow-others: true

app:
  environment: DEV
  description: Local Development Environment

# UAT
---
spring:
  config:
    activate:
      on-profile: UAT

  datasource:
    url: jdbc:postgresql://uat-db-server:5432/eshopdb
    driver-class-name: org.postgresql.Driver
    username: eshop_uat_user
    password: ${DB_UAT_PASSWORD}

  jpa:
    hibernate:
      ddl-auto: none
    show-sql: false
    database-platform: org.hibernate.dialect.PostgreSQLDialect

app:
  environment: UAT
  description: User Acceptance Testing Environment


# PROD
---
spring:
  config:
    activate:
      on-profile: PROD

  datasource:
    url: jdbc:mysql://prod-db-server:3306/eshopdb
    driver-class-name: com.mysql.cj.jdbc.Driver
    username: eshop_prod_user
    password: ${DB_PROD_PASSWORD}

  jpa:
    hibernate:
      ddl-auto: none
    show-sql: false
    database-platform: org.hibernate.dialect.MySQL8Dialect

app:
  environment: PROD
  description: Production Environment
